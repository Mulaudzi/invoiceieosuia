<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IEOSUIA Invoices</title>
    <meta name="description" content="Create, send, and manage professional invoices with IEOSUIA Invoices." />
    <meta name="author" content="IEOSUIA" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        var path = window.location.pathname.replace(/\/+$/, '') || '/';
        if (path === '/login' && !window.location.hash.includes('ieosuia_token=')) window.location.replace('/api/auth/ieosuia/start');
        if (path === '/register') window.location.replace('/api/auth/ieosuia/start?screen_hint=signup');
      })();
    </script>

    <meta property="og:title" content="IEOSUIA Invoices" />
    <meta property="og:description" content="Create, send, and manage professional invoices with IEOSUIA Invoices." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://invoices.ieosuia.com/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="IEOSUIA Invoices" />
    <meta name="twitter:description" content="Create, send, and manage professional invoices with IEOSUIA Invoices." />
    <meta name="twitter:image" content="https://invoices.ieosuia.com/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script>
      // A cached HTML document can briefly reference an asset from the previous
      // deployment. Recover once with a cache-bypassed navigation.
      (function () {
        var key = 'ieosuia-asset-recovery';
        function recover(event) {
          var message = String((event && (event.message || event.reason)) || '');
          var source = String((event && event.target && event.target.src) || '');
          if (!/MIME|module script|dynamically imported|Loading chunk/i.test(message) && !/\/assets\/.*\.js/i.test(source)) return;
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, '1');
          var url = new URL(location.href); url.searchParams.set('_refresh', Date.now());
          location.replace(url.toString());
        }
        addEventListener('error', recover, true);
        addEventListener('unhandledrejection', recover);
        addEventListener('load', function () { setTimeout(function () { sessionStorage.removeItem(key); }, 5000); });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
